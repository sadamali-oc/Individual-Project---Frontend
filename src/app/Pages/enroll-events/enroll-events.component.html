<div class="page-center-wrapper">
  <mat-card class="event-list-card">
    <!-- Search & Status Filter -->
    <div class="search-filter-container header-actions">
      <mat-form-field
        appearance="outline"
        class="event-filter-input"
      >
        <mat-label>Search Events</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          [(ngModel)]="searchTerm"
          (input)="applyFilter()"
          placeholder="Enter event name"
        />
        <button
          mat-icon-button
          matSuffix
          (click)="clearFilter()"
          aria-label="Clear"
        >
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
    </div>

    <!-- Event Table -->
    <div class="event-table-container">
      <table
        mat-table
        [dataSource]="dataSource"
        matSort
        class="mat-elevation-z8 full-width-table"
      >
        <!-- Event Name -->
        <ng-container matColumnDef="event_name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Event</th>
          <td mat-cell *matCellDef="let element" data-label="Event">
            {{ element.event_name }}
          </td>
        </ng-container>

        <!-- Date -->
        <ng-container matColumnDef="event_date">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
          <td mat-cell *matCellDef="let element" data-label="Date">
            {{ element.event_date | date }}
          </td>
        </ng-container>




        <!-- Event Mode -->
        <ng-container matColumnDef="event_mode">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Event Mode</th>
          <td mat-cell *matCellDef="let element" data-label="Event Mode">
            {{ element.event_mode }}
          </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let element" class="status-cell" data-label="Status">
            <button
              mat-icon-button
              color="primary"
              (click)="viewDetails(element)"
              aria-label="View Details"
            >
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element" class="actions-cell" data-label="Actions">
            <mat-slide-toggle
              [checked]="element.isEnrolled"
              (change)="onToggleEnroll(element, $event.checked)"
            >
              Enrolled
            </mat-slide-toggle>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- No Data Row -->
        <tr class="mat-no-data-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">No events found.</td>
        </tr>
      </table>
    </div>

    <!-- Paginator -->
    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
    ></mat-paginator>
  </mat-card>
</div>
